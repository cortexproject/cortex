syntax = "proto3";

package clientlimiter;

import "gogoproto/gogo.proto";

option (gogoproto.marshaler_all) = true;
option (gogoproto.unmarshaler_all) = true;

// ClientCounterDesc is the value stored under a single tenant's key in the
// memberlist-backed KV store used for distributed client-identity rate
// limiting. It is gossiped and merged across all replicas (distributors, or
// query-frontends) -- see clientlimiter.GossipLimiter and the Merge
// implementation in counter_desc.go.
message ClientCounterDesc {
    map<string, ClientEntry> clients = 1;
}

// ClientEntry holds one client identity's counters, contributed by every
// replica that has recently seen requests for it.
message ClientEntry {
    map<string, ReplicaCounter> replicas = 1;
}

// ReplicaCounter is a single replica's contribution: the number of tokens it
// has locally counted against the current window.
message ReplicaCounter {
    int64 count = 1;
    int64 window_start_unix_nano = 2;
    // Updated on every local increment, independent of window rollover --
    // used to prune replicas that have gone quiet (e.g. shut down) rather
    // than waiting for their window to roll over forever.
    int64 last_update_unix_nano = 3;
}
